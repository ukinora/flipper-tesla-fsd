name: build

# Builds the Flipper .fap and every ESP32 firmware variant on each push, PR,
# and tag. Tag pushes (v*) also attach all artifacts to the GitHub Release so
# testers can download a coherent build without a local toolchain.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed for the release-upload job on tags

jobs:
  host-tests:
    name: Host unit tests (protocol core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run protocol-core tests
        run: make -C test check

      # 🔴 `make check` REGENERATES test/fixtures/wire_vectors.json, and until
      # now nothing compared it with the committed copy.
      #
      # That copy is what the Android app checks itself against — the app's CI
      # clones this repo just to read it. So a fixture that had gone stale would
      # let the app validate against bytes this firmware does not actually
      # produce, and both sides would be green. That is precisely the state the
      # fixture exists to prevent, one level up.
      #
      # The generator is the authority. If this fails, run `make -C test check`
      # and commit the file it wrote — do not edit it by hand.
      - name: 커밋된 픽스처가 방금 구운 것과 같은가
        run: |
          set -eu
          f=test/fixtures/wire_vectors.json
          if ! git diff --quiet -- "$f"; then
            echo "::error file=$f::픽스처가 낡았다 — 패커가 내놓는 것과 다르다"
            echo "고치는 법: make -C test check 를 돌리고 $f 를 커밋한다"
            git diff --stat -- "$f"
            git diff -- "$f" | head -60
            exit 1
          fi
          echo "픽스처가 패커와 일치한다 ($(wc -c < "$f") B)"
      # The two CAN ID lists used to be compared only by the compiler's
      # "macro redefined" warning, which nobody read. The warning is gone now
      # (the headers no longer collide), so this is the only thing left that
      # notices when they drift.
      - name: CAN IDs agree across both headers
        run: python test/check_can_ids.py

  flipper-fap:
    name: Flipper .fap (ufbt)
    needs: [host-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned for the same reason as PlatformIO below.
      #
      # ⚠️ The SDK channel is still `release`, which MOVES. Pinning it needs a
      # specific Flipper SDK version that somebody has actually validated this
      # app against, and nobody here has: this repo's target is the ESP32 and
      # the .fap is upstream's. Recorded rather than papered over -- a pin
      # chosen at random would look like reproducibility without being it.
      - name: Install ufbt
        run: pip install "ufbt==0.2.6"
      - name: Fetch SDK (release channel — see note above)
        run: ufbt update --channel=release
      - name: Build app
        run: ufbt
      - name: Collect .fap
        run: |
          mkdir -p out
          # ufbt drops the artifact in dist/ and/or .ufbt/build/
          find dist .ufbt/build -name 'tesla_mod.fap' -exec cp {} out/ \; 2>/dev/null || true
          ls -la out
          test -f out/tesla_mod.fap
      - uses: actions/upload-artifact@v4
        with:
          name: flipper-tesla_mod-fap
          path: out/tesla_mod.fap
          if-no-files-found: error

  esp32-matrix:
    name: ESP32 ${{ matrix.env }}
    needs: [host-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - m5stack-atom
          - m5stack-atom-matrix
          - m5stack-atom-swap-pins
          - esp32-mcp2515
          - esp32-lilygo
          - lilygo-t2can
          - ttgo-tdisplay
          - waveshare-s3-can
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esp32/.pio
          key: pio-${{ matrix.env }}-${{ hashFiles('esp32/platformio.ini') }}
      # Pinned, not --upgrade. The CLI chooses the toolchain and the build
      # scripts, so an upgrade landing between two runs changes the binary
      # without a line of this repo changing -- which is the whole thing the
      # version pins in platformio.ini exist to prevent.
      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"
      - name: Build ${{ matrix.env }}
        working-directory: esp32
        run: pio run -e ${{ matrix.env }}
      # lilygo-t2can is installed permanently in a car and has no dashboard, so
      # WiFi there is attack surface with a published password and no auth on
      # the control socket. Nothing in the source makes that removal hard to undo
      # by accident -- one #include in a shared header brings the library back.
      - name: No WiFi in ${{ matrix.env }}
        if: matrix.env == 'lilygo-t2can'
        working-directory: esp32
        run: python ci_check_no_wifi.py ${{ matrix.env }}
      - name: Stage firmware
        working-directory: esp32
        run: |
          mkdir -p out
          # App-only image — for the in-device OTA updater (dashboard upload).
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "out/tesla-fsd-${{ matrix.env }}.bin"
          # Full-flash merged image (offset 0) — for the browser flasher on a blank board.
          cp ".pio/build/${{ matrix.env }}/firmware-merged.bin" "out/tesla-fsd-${{ matrix.env }}-merged.bin"
          test -f "out/tesla-fsd-${{ matrix.env }}.bin"
          test -f "out/tesla-fsd-${{ matrix.env }}-merged.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-${{ matrix.env }}
          path: esp32/out/*.bin
          if-no-files-found: error

  release:
    name: Attach artifacts to release
    needs: [flipper-fap, esp32-matrix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + rename
        run: |
          mkdir -p release
          find artifacts -name '*.fap' -exec cp {} release/ \;
          find artifacts -name '*.bin' -exec cp {} release/ \;
          # Self-contained browser flasher — download it and open in Chrome/Edge
          # to flash without hosting anything.
          cp docs/install/index.html release/tesla-flasher.html
          ls -la release
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
