# Versions are PINNED, not ranged.
#
# `platform = espressif32` with no version follows whatever PlatformIO resolves
# today, and the platform carries the Arduino core -- so a background release
# can change the compiled binary without a single line of this repo changing.
# That matters here more than in most projects: the firmware that passes on the
# bench has to be the same firmware that goes into the car for a capture that
# cannot be repeated.
#
# Recorded from a known-good build: platform 7.0.1, Arduino core as bundled.
# To move: change the number here deliberately, rebuild, re-run the checks.

[platformio]
src_dir = .firmware

# Shared by every env below: after each build, also emit firmware-merged.bin
# (full-flash image at offset 0) for the browser flasher. See merge_firmware.py.
[env]
extra_scripts = post:merge_firmware.py

# The platform pin above fixes espressif32 itself; these fix what it pulls in.
# Without them `platform_packages` resolves through ~ ranges, so the Arduino core
# and the flashing tool can both move under a pinned platform -- which is most of
# what actually ends up in the binary. Recorded from the same known-good build.
#
# ⚠️ These apply to every environment because they are what a firmware IS. If one
# of these versions ever becomes undownloadable the build stops, loudly; that is
# the trade this pin exists to make.
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.41100.0

# src_dir is .firmware, so anything shared from fsd_logic/ has to be named here
# or it never reaches the linker. fsd_autonomy.c is in the base section because
# main.cpp calls its observers unconditionally — a per-variant filter would only
# link for the variant that declared it, and the rest fail at link time.
# It also fixes a real bug on every variant: this build does not compile
# fsd_logic/fsd_handler.c, so 0x286 and 0x311 were never parsed here at all.
build_src_filter =
    +<*>
    +<../../fsd_logic/fsd_autonomy.c>
# Same reason as the line above: main.cpp calls power_log_init()/tick()
# unconditionally, so every variant compiles power_log.cpp and every variant
# needs the pure verdict logic it calls. Putting this in a per-variant filter
# builds fine on that variant and fails at link time on all the others.
    +<../../fsd_logic/fsd_power.c>
# Same again: main.cpp calls fsd_selftest_decide() unconditionally. It is the
# OTA accept/rollback decision, kept out of the shim so the ordering of its
# thresholds can be host-tested -- that ordering was wrong once already.
    +<../../fsd_logic/fsd_selftest.c>

