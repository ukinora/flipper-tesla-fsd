[platformio]
src_dir = .firmware

# Shared by every env below: after each build, also emit firmware-merged.bin
# (full-flash image at offset 0) for the browser flasher. See merge_firmware.py.
[env]
extra_scripts = post:merge_firmware.py

# src_dir is .firmware, so anything shared from fsd_logic/ has to be named here
# or it never reaches the linker. fsd_autonomy.c is in the base section because
# main.cpp calls its observers unconditionally — a per-variant filter would only
# link for the variant that declared it, and the rest fail at link time.
# It also fixes a real bug on every variant: this build does not compile
# fsd_logic/fsd_handler.c, so 0x286 and 0x311 were never parsed here at all.
build_src_filter =
    +<*>
    +<../../fsd_logic/fsd_autonomy.c>
# Same reason as the line above: main.cpp calls power_log_init()/tick()
# unconditionally, so every variant compiles power_log.cpp and every variant
# needs the pure verdict logic it calls. Putting this in a per-variant filter
# builds fine on that variant and fails at link time on all the others.
    +<../../fsd_logic/fsd_power.c>

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -D BOARD_M5STACK_ATOM
    -D CAN_DRIVER_TWAI
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    Links2004/WebSockets@^2.4.0

[env:m5stack-atom-matrix]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -D BOARD_M5STACK_ATOM
    -D BOARD_M5STACK_ATOM_MATRIX
    -D CAN_DRIVER_TWAI
    -D LED_COUNT=25
    ; ATOM Matrix 5x5 SK6812 grid (vs the Lite's single LED).
    ; Front-face button is on GPIO 39, not GPIO 0 (the side BOOT button) —
    ; GPIO 39 is input-only with an external PCB pull-up, so the obvious front
    ; button finally works. Original work by @maslyankov (PR #46).
    -D PIN_BUTTON=39
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    Links2004/WebSockets@^2.4.0

[env:m5stack-atom-swap-pins]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -D BOARD_M5STACK_ATOM
    -D CAN_DRIVER_TWAI
    -D PIN_CAN_TX=19
    -D PIN_CAN_RX=22
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    Links2004/WebSockets@^2.4.0

