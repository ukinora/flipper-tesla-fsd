[env:lilygo-t2can]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -D BOARD_LILYGO_T2CAN
    -D CAN_DRIVER_T2CAN_DUAL
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; BLE GATT server for the phone app (ble_server.cpp). Only this variant
    ; enables it — the others keep their current flash footprint.
    -D BLE_SERVER_ENABLED
    ; This board is wired permanently into a car, so it powers up unattended
    ; whenever the car wakes. Never restore Active mode from NVS. See prefs.h.
    -D PERSIST_OP_MODE=0
    ; No WiFi, no web dashboard, no HTTP CAN stream on this variant.
    ;
    ; The AP password is a fixed "12345678" printed in this repo's README, and
    ; ws_event() in web_dashboard.cpp authenticates nothing -- one WebSocket
    ; message flips the module to Active, which opens CAN transmit on every bus,
    ; and further messages change safety settings and persist them. A parked car
    ; broadcasting that to everyone within radio range is not a trade this build
    ; can make: its phone app speaks BLE, so the dashboard was never going to be
    ; used here anyway. blackbox.h already assumed this ("on a T-2CAN we do not
    ; intend to bring WiFi up at all").
    ;
    ; Second reason, not security: blackbox.cpp holds back a heap margin for the
    ; WiFi/web stack, and the ring it competes with is where the one-shot capture
    ; taken before the TSL comes out is recorded.
    ;
    ; Cost: no OTA. This variant is flashed over USB-C.
    -D FSD_NO_WIFI

; Restates the base filter and adds the camera judgement core on top. Written
; out rather than interpolated so the full source set for this variant is
; readable in one place. Only this variant carries fsd_camera.c — the others
; have no camera database and keep their current flash footprint.
build_src_filter =
    +<*>
    +<../../fsd_logic/fsd_autonomy.c>
    +<../../fsd_logic/fsd_camera.c>
    +<../../fsd_logic/fsd_cam_track.c>
    +<../../fsd_logic/fsd_cam_policy.c>
    ; Produces the FsdCamFix the three above consume. Belongs to this variant
    ; and not to [env] because it calls fsd_cam_distance_m().
    +<../../fsd_logic/fsd_gps.c>
    ; Linked for ONE pure function: fsd_sp_decode_profile(), the 0x3FD speed
    ; profile read-back. The convergence state machine in this file is
    ; deliberately NOT instantiated — no FsdSpeedProfile is declared anywhere in
    ; this firmware and nothing calls fsd_sp_request / fsd_sp_poll /
    ; fsd_sp_apply_scroll. Both of its gates stay structurally closed.
    +<../../fsd_logic/fsd_speed_profile.c>
    ; Body control (T1 interior light, T2 passenger door). Compiled here so the
    ; cross-compiler checks them, NOT because anything calls them yet: no shim
    ; exists, so the linker drops all three. None of them constructs a CAN
    ; frame, and fsd_body.c refuses every body ID unconditionally.
    +<../../fsd_logic/fsd_body.c>
    +<../../fsd_logic/fsd_body_t1.c>
    +<../../fsd_logic/fsd_body_t2.c>
    ; Button press classification for the BLE client (ble_central.cpp).
    +<../../fsd_logic/fsd_button.c>
    ; The BLE payload layouts. Pure, host-tested, and the generator for the
    ; byte vectors the Android app is tested against.
    +<../../fsd_logic/fsd_wire.c>
    ; Restated from [env] on purpose: this filter REPLACES the base one rather
    ; than extending it, so anything main.cpp calls unconditionally has to
    ; appear in both. Leaving it out builds every other variant and fails only
    ; this one, at link time.
    +<../../fsd_logic/fsd_power.c>
    ; FSD_NO_WIFI (see build_flags) guards every call site in main.cpp; these
    ; three lines are what actually keeps the code out of the flash image. The
    ; guards alone would still compile and link all of it.
    -<wifi_manager.cpp>
    -<web_dashboard.cpp>
    -<http_can_stream.cpp>

; The default LDF mode ("chain") scans #include lines as plain text and does not
; evaluate #if. blackbox.h guards its <WiFi.h> behind FSD_NO_WIFI, but the
; scanner cannot see that, so libWiFi.a was still built and put on the link line
; of a firmware that has no WiFi. No member was ever adopted -- the ELF was
; clean either way -- but a dependency graph that disagrees with the build is
; the kind of thing an audit has to chase to the bottom before it can be
; dismissed. "chain+" evaluates the conditionals.
lib_ldf_mode = chain+

lib_deps =
    autowp/autowp-mcp2515@^1.3.0
    h2zero/NimBLE-Arduino@^2.1.2

[env:ttgo-tdisplay]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -D BOARD_TTGO_DISPLAY
    -D CAN_DRIVER_MCP2515
    -D USER_SETUP_LOADED
    -D ST7789_DRIVER
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MISO=-1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
lib_deps =
    autowp/autowp-mcp2515@^1.3.0
    Links2004/WebSockets@^2.4.0
    bodmer/TFT_eSPI@^2.5.43

[env:waveshare-s3-can]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

build_flags =
    -D BOARD_WAVESHARE_S3
    -D CAN_DRIVER_TWAI
    -D PIN_CAN_TX=15
    -D PIN_CAN_RX=16
    -D PIN_LED=46
    -D PIN_BUTTON=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    Links2004/WebSockets@^2.4.0
